---
metadata:
  title: Name a SNAP or cash benefits representative
  short title: Name a SNAP or cash benefits representative
  description: >-
    Use form Image-10 to choose someone to help with your Massachusetts DTA benefits.
    That person is called an authorized representative. They can help with your SNAP
    (food stamps) or cash benefits (TAFDC or EAEDC).
  can_I_use_this_form: |
    Use this form if you want someone you trust to help with your Massachusetts SNAP or cash benefits.
    You can choose what they are allowed to do.
  before_you_start: |
    Have your DTA Agency ID or the last four digits of your Social Security number.
    If the person will sign SNAP forms for you, have their phone number.
  when_you_are_finished: |
    Download the signed form and send it to DTA.
  authors:
    - sfigalora
  jurisdiction: NAM-US-US+MA
  languages:
    - en
  LIST_topics:
    - BE-02-01-00-00
    - BE-02-02-00-00
    - BE-02-05-00-00
  tags:
    - BE-02-01-00-00
    - BE-02-02-00-00
    - BE-02-05-00-00
  original_form: https://www.mass.gov/doc/request-to-choose-someone-to-be-my-authorized-representative-image-10-0/download
  help_page_title: DTA guidance on choosing a representative
  help_page_url: https://www.mass.gov/lists/request-to-choose-someone-to-be-my-authorized-representative
  form_titles:
    - Request to Choose Someone to Be My Authorized Representative
  form_numbers:
    - Image-10
---
comment: |
  This contains metadata that will not be overwritten if this YAML file is included in another
  file. Each file gets its own key in the interview_metadata dictionary.
  Most keys are not currently used at runtime, other than "allowed courts".
code: |
  interview_metadata
  package_title
  if "allowed courts" not in interview_metadata.get("Request_a_food_benefit_representative", {}):
    interview_metadata.initializeObject("Request_a_food_benefit_representative")
    interview_metadata["Request_a_food_benefit_representative"].update({
      "al_weaver_version": "0.81",
      "generated on": "2021-04-17",
      "title": package_title,
      "short title": package_title,
      "description": all_variables(special="metadata").get("description", ""),
      "original_form": all_variables(special="metadata").get("original_form", ""),
      "allowed courts": [],
      "categories": all_variables(special="metadata").get("LIST_topics", []),
      "logic block variable": "interview_order_Request_a_food_benefit_representative",
      "attachment block variable": "Request_a_food_benefit_representative_attachment",
      "typical role": "plaintiff",
    })
  dta_metadata_ready = True

---
code: |
  al_form_type = 'other'
---
objects:
  - users: ALPeopleList.using(ask_number=True,target_number=1)
  - representatives: ALPeopleList.using(ask_number=True,target_number=1)
---
sections:
  - review_Request_a_food_benefit_representative: Review your answers
---
#################### Interview order #####################
comment: |
  Controls order and branching logic for questions specific to this form
id: interview_order_Request_a_food_benefit_representative
code: |
  # Set the allowed courts for this interview
  allowed_courts = interview_metadata["Request_a_food_benefit_representative"]["allowed courts"]
  nav.set_section('review_Request_a_food_benefit_representative')
  user_role = 'plaintiff'
  users.gather()
  set_parts(subtitle=str(users))
  users[0].address.address
  set_progress(20.0)
  user_ssn
  representatives.gather()
  user_shopper_yes
  dta_signer_name
  set_progress(40.0)
  interview_order_Request_a_food_benefit_representative = True
---
###################### Main order ######################
comment: |
  This block includes the logic for standalone interviews.
  Delete mandatory: True to include in another interview
mandatory: True
code: |
  dta_metadata_ready
  al_intro_screen
  Request_a_food_benefit_representative_intro
  interview_order_Request_a_food_benefit_representative
  dta_current_signing_answers = (
    dta_signer_role,
    dta_signer_name,
    users[0].name.full(),
    users[0].address.on_one_line(),
    user_ssn,
    representatives[0].name.full(),
    user_application_yes,
    user_shopper_yes,
    user_authorized_yes,
    user_cash_yes,
    second_phone_number if user_application_yes else "",
  )
  if defined("dta_signed_answers") and dta_signed_answers != dta_current_signing_answers:
    undefine(
      "dta_signature",
      "signature_date",
      "saw_signature_choice",
      "basic_questions_signature_flow",
      "Request_a_food_benefit_representative_preview_question",
      "dta_signed_answers",
    )
  signature_date
  # Save anonymized interview statistics (customize the saved data below)
  store_variables_snapshot(data={'zip': users[0].address.zip})
  Request_a_food_benefit_representative_preview_question
  basic_questions_signature_flow
  dta_signature
  dta_signed_answers = dta_current_signing_answers
  Request_a_food_benefit_representative_download
---
comment: |
  This question is used to introduce your interview. Please customize
id: Choose_someone_as_a_food_benefits_representative
continue button field: Request_a_food_benefit_representative_intro
question: |
  Name your {SNAP} or cash benefits representative
subquestion: |
  Use this form to name someone you trust to help with your SNAP or cash benefits.
  They do not need to be your legal guardian. You give them permission by signing and sending this form.

  You can choose which tasks this person can do for you:

  * Sign SNAP forms, tell {DTA} about changes, and talk to DTA about your SNAP case.
  * Shop for you using your SNAP benefits.
  * Tell DTA about changes and talk to DTA about your cash benefits case.
  * Get money for you from your {TAFDC} or {EAEDC} account.

  You can name one person per form. That person can do more than one task.
  They must show proof of identity. To change or cancel your choice, call 1-800-997-2555.

terms:
  TAFDC: |
    Transitional Aid to Families with Dependent Children
  SNAP: |
    Supplemental Nutrition Assistance Program, formerly known as food stamps 
  DTA: |
    Department of Transitional Assistance
  EAEDC: |
    Emergency Aid to the Elderly, Disabled and Children
    
---
id: Social Security Number SSN or Agency ID

question: | 
  Which number do you have for your DTA case?
  

fields:
  - "Do you know your DTA Agency ID?": agency_id
    datatype: yesnoradio
    help: |
      You can find this number on DTA notices.
  - "DTA Agency ID": user_ssn
    show if: agency_id
  - "Last 4 digits of your Social Security Number (SSN)": user_ssn
    maxlength: 4
    show if: 
      variable: agency_id
      is: False
validation code: |
  if not agency_id and (len(user_ssn) != 4 or not user_ssn.isascii() or not user_ssn.isdecimal()):
    validation_error("Enter exactly four digits.", field="user_ssn")
---
id: Representative name
sets:
    - representatives[0].name.first
    - representatives[0].name.last
question:  |
  Who is your authorized representative going to be?
subquestion: |
  You can name one person per form. They can do more than one task. To name another person, fill out another form.
fields:
  - code: |
      representatives[0].name_fields()


---
id: Choose a representative
question: |
  What should ${representatives[0].name.first} ${representatives[0].name.last} be authorized to do?
subquestion: |
  You can give ${representatives[0].name.first} access to your SNAP benefits, cash benefits, or both.  
fields:
  - "Act as an application representative for your **SNAP benefits**": user_application_yes
    datatype: yesno
    help: |
      This person can sign SNAP forms, tell DTA about changes, and talk to DTA about your case. If they give wrong information, you may have to pay back any extra benefits you receive.

  - "Shop using your **SNAP benefits**": user_shopper_yes
    datatype: yesno
    help: |
      This person will get an EBT card that lets them shop for you using your SNAP benefits. You will also get an EBT card.

  - "Act as an authorized representative for your **cash benefits** account": user_authorized_yes
    datatype: yesno
    help: |
      This person can tell DTA about changes and talk to DTA about your case. If they give wrong information, you may have to pay back any extra benefits you receive.
  - "Be authorized to get money from your **cash benefits** account": user_cash_yes
    datatype: yesno
    help: |
      This person will get an EBT card. They can use it to get money from your {TAFDC} or {EAEDC} account for you. You will also get a card.

  - "${representatives[0].name.first}'s phone number": second_phone_number
    datatype: al_phone
    maxlength: 22
    show if: user_application_yes

validation code: |
  if not any((user_application_yes, user_shopper_yes, user_authorized_yes, user_cash_yes)):
    validation_error("Choose at least one task for your representative.")
  if user_application_yes and not phone_number_is_valid(second_phone_number):
    validation_error("Enter a valid phone number, including the area code.", field="second_phone_number")
---
id: Who will be signing
question: |
  Who will sign this form?
fields:
  - Signer: dta_signer_role
    datatype: radio
    choices:
      - ${ users[0].name.full() }: client
      - Legal guardian: guardian
  - Legal guardian's full name: dta_guardian_name
    show if:
      variable: dta_signer_role
      is: guardian
---
depends on:
  - dta_signer_role
  - dta_guardian_name
  - users[0].name.first
  - users[0].name.middle
  - users[0].name.last
  - users[0].name.suffix
code: |
  dta_signer_name = dta_guardian_name if dta_signer_role == "guardian" else users[0].name.full()
---
code: |
  al_form_requires_digital_signature = True
  signature_fields = ["dta_signature"]
---
id: Image-10 signing method
question: |
  How will you sign your form?
continue button field: saw_signature_choice
fields:
  - Signing method: signature_choice
    datatype: radio
    code: |
      (
        [
          ["this_device", word("Draw your signature on this device")],
          ["phone", word("Draw your signature on a phone")],
        ]
        + (
          []
          if al_form_requires_digital_signature
          else [["sign_after_printing", word("Sign after printing")]]
        )
      )
---
id: sign Image-10
question: |
  ${ dta_signer_name }, sign the form
subquestion: |
  % if dta_signer_role == "guardian" and (user_application_yes or user_shopper_yes):
  DTA asks a legal guardian signing for SNAP to send a copy of the guardianship decree with this form.
  % endif

  Draw your signature in the box below. If you prefer to sign on paper,
  you can fill in and print [DTA’s Image-10 form](https://www.mass.gov/lists/request-to-choose-someone-to-be-my-authorized-representative).
signature: dta_signature

---
id: preview Request_a_food_benefit_representative
question: |
  Preview your form before you sign it
subquestion: |
  Here is a preview of the form you will sign on the next page.   
  
  ${ al_user_bundle.as_pdf(key='preview') }

  Click the image to open it in a new tab. Click the "Make changes" button
  to edit your answers.

  ${ action_button_html(url_action('review_Request_a_food_benefit_representative'), label='Make changes', color='info') }
  
  Remember to come back to this window to continue and sign your form.
continue button field: Request_a_food_benefit_representative_preview_question    
---
id: Request a food benefit representative review screen
event: review_Request_a_food_benefit_representative
question: |
  Review your answers
review:
  - Edit: users[0].name.first
    button: |
      **Benefits client**: ${ users[0].name }
  - Edit: users[0].address.address
    button: |
      **Benefits client's address**: ${ users[0].address.on_one_line() }
  - Edit: user_ssn
    button: |
      **DTA Agency ID or last four Social Security digits**: ••••
  - Edit: representatives[0].name.first
    button: |
      **Representative**: ${ representatives[0].name }
  - Edit: user_application_yes
    button: |
      **Permissions**

      * Sign SNAP forms: ${ yesno(user_application_yes) }
      * Shop with SNAP benefits: ${ yesno(user_shopper_yes) }
      * Discuss cash benefits: ${ yesno(user_authorized_yes) }
      * Get money from cash benefits: ${ yesno(user_cash_yes) }
      % if user_application_yes:
      * Representative phone number: ${ second_phone_number }
      % endif
  - Edit: dta_signer_role
    button: |
      **Signer**: ${ dta_signer_name }

---
id: download Request_a_food_benefit_representative
event: Request_a_food_benefit_representative_download
question: |
  Your form is ready to download.
subquestion: |
  
  Your form is ready to download and deliver.

  View, download and send your form below. Click the "Make changes" button to fix any mistakes.
  
  % if dta_signer_role == "guardian" and (user_application_yes or user_shopper_yes):
  Include a copy of the guardianship decree when you send this form.
  % endif

  You can send the signed form in any of these ways:
  
  * mailing it to the DTA Document Processing Center, P.O. Box 4406, Taunton, MA 02780‐0420
  * sending it by fax to 617-887‐8765 
  * taking it to your local DTA office
  * uploading it in [DTA Connect](https://www.mass.gov/info-details/help-using-dta-connect)

  ${ action_button_html(url_action('review_Request_a_food_benefit_representative'), label='Make changes', color='info') }

  ${ al_user_bundle.download_list_html() }

  ${ al_user_bundle.send_button_html() }
  
progress: 100
---
objects:
  - Request_a_food_benefit_representative_attachment: ALDocument.using(title="Request a SNAP benefits or cash benefits representative", filename="authorize_food_benefits_representative.pdf", enabled=True, has_addendum=False)
---
objects:
  - al_user_bundle: ALDocumentBundle.using(elements=[Request_a_food_benefit_representative_attachment], filename="Request a SNAP benefits or cash benefits representative.pdf", title="All forms to download for your records")
  - al_court_bundle: ALDocumentBundle.using(elements=[Request_a_food_benefit_representative_attachment], filename="Request a food benefit representative.pdf", title="All forms to download for your records")
---
attachment:
  variable name: Request_a_food_benefit_representative_attachment[i]
  name: Request_a_food_benefit_representative_attachment
  filename: Request-a-food-benefit-representative
  skip undefined: True
  pdf template file: authorize_food_benefits_representative.pdf
  fields:
      - "user": ${ users[0] }
      - "user_address_on_one_line": ${ users[0].address.on_one_line() }
      - "user_signature": ${ dta_signature if i == "final" else "" }
      - "user_phone_number": ${ users[0].phone_numbers() }
      - "signature_date": ${ signature_date }
      - "user_ssn": ${ user_ssn.strip() }
      - "user_application_rep": ${ representatives[0].name if user_application_yes else ''}
      - "user_application_yes": ${ user_application_yes }
      - "user_shopper": ${ representatives[0].name if user_shopper_yes else ''}
      - "user_shopper_yes": ${ user_shopper_yes }
      - "user_authorized_rep": ${ representatives[0].name if user_authorized_yes else ''}
      - "user_authorized_yes": ${ user_authorized_yes }
      - "user_cash_recipient": ${ representatives[0].name if user_cash_yes else ''}
      - "user_cash_yes": ${ user_cash_yes }
      - "Signature_name": ${ dta_signer_name }
      - "second_phone_number": ${ second_phone_number if user_application_yes else ' '}
